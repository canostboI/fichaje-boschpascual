<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Panel Encargado - Bosch Pascual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0a; --surface: #131313; --surface2: #1a1a1a; --border: rgba(255,255,255,0.08);
            --primary: #1a6b6b; --primary-light: #238787;
            --text: #fff; --text2: #a0a0a0; --text3: #666;
            --success: #22c55e; --danger: #e63946; --warning: #f59e0b; --info: #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        
        .container { max-width: 900px; margin: 0 auto; padding: 16px; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; color: var(--primary); }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-name { font-size: 14px; color: var(--text2); }
        .btn-logout { background: transparent; border: 1px solid var(--border); color: var(--text2); padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
        .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

        /* Login */
        .login-container { max-width: 400px; margin: 60px auto; padding: 0 16px; }
        .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
        .login-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; text-align: center; margin-bottom: 8px; }
        .login-subtitle { font-size: 14px; color: var(--text2); text-align: center; margin-bottom: 24px; }
        .login-error { color: var(--danger); font-size: 14px; text-align: center; margin-top: 16px; display: none; }

        /* Forms */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .form-input, .form-select { width: 100%; padding: 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 15px; font-family: inherit; }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--primary); }
        .form-checkbox { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
        .form-checkbox input { width: 18px; height: 18px; accent-color: var(--primary); }

        /* Buttons */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: white; width: 100%; font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-light); }
        .btn-secondary { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
        .btn-sm { padding: 8px 14px; font-size: 13px; }
        .btn svg { width: 16px; height: 16px; }

        /* Tabs */
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; overflow-x: auto; }
        .tab { padding: 10px 16px; background: transparent; border: none; color: var(--text2); font-size: 14px; cursor: pointer; border-radius: 8px; white-space: nowrap; }
        .tab:hover { background: var(--surface2); color: var(--text); }
        .tab.active { background: var(--primary); color: white; }

        /* Obra selector */
        .obra-selector { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .obra-selector label { font-size: 13px; color: var(--text2); margin-bottom: 8px; display: block; }

        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; }
        .stat-value { font-family: 'DM Mono', monospace; font-size: 28px; margin-bottom: 4px; }
        .stat-value.success { color: var(--success); }
        .stat-value.warning { color: var(--warning); }
        .stat-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; }

        /* Cards */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
        .card-title { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px; }

        /* Worker list */
        .worker-list { display: flex; flex-direction: column; gap: 10px; }
        .worker-item { background: var(--surface2); border-radius: 10px; padding: 14px; display: flex; align-items: center; gap: 12px; }
        .worker-item.en-obra { border-left: 3px solid var(--success); }
        .worker-item.salio { border-left: 3px solid var(--text3); opacity: 0.7; }
        .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .dot.green { background: var(--success); }
        .dot.gray { background: var(--text3); }
        .worker-avatar { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), var(--primary-light)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 14px; color: white; flex-shrink: 0; }
        .worker-info { flex: 1; min-width: 0; }
        .worker-name { font-weight: 600; font-size: 14px; }
        .worker-meta { font-size: 12px; color: var(--text2); }
        .worker-time { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--primary); text-align: right; }
        .late-tag { display: inline-block; background: var(--warning); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; margin-left: 6px; }

        /* Table */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); padding: 10px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        td { padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
        tr:hover { background: var(--surface2); }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
        .badge.success { background: rgba(34,197,94,0.15); color: var(--success); }
        .badge.danger { background: rgba(230,57,70,0.15); color: var(--danger); }
        .badge.warning { background: rgba(245,158,11,0.15); color: var(--warning); }
        .badge.manual { background: rgba(147,51,234,0.15); color: #a855f7; }

        /* Filters */
        .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
        .filters input[type="date"] { padding: 8px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; color-scheme: dark; }

        /* Empty */
        .empty { text-align: center; padding: 40px 20px; color: var(--text2); }

        /* Sections */
        .section { display: none; }
        .section.active { display: block; }

        /* Screens */
        .screen { display: none; }
        .screen.active { display: block; }

        /* Loading */
        .loading { display: flex; align-items: center; justify-content: center; padding: 40px; }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Pagination */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 16px; }
        .pagination button { padding: 6px 12px; }
        .pagination span { color: var(--text2); font-size: 13px; }

        /* Responsive */
        @media (max-width: 640px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .worker-item { flex-wrap: wrap; }
            .worker-time { width: 100%; text-align: left; margin-top: 8px; }
        }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div class="screen active" id="screenLogin">
        <div class="login-container">
            <div style="text-align:center;margin-bottom:32px;">
                <div class="logo" style="font-size:32px;">BOSCH PASCUAL</div>
            </div>
            <div class="login-card">
                <div class="login-title">PANEL ENCARGADO</div>
                <div class="login-subtitle">Accede para gestionar tu obra</div>
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" id="loginEmail" placeholder="tu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label class="form-checkbox">
                            <input type="checkbox" id="rememberMe" checked>
                            <span>Recordarme en este dispositivo</span>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btnLogin">INICIAR SESIÓN</button>
                </form>
                <p class="login-error" id="loginError"></p>
            </div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="screen" id="screenDashboard">
        <div class="container">
            <header class="header">
                <div class="logo">BOSCH PASCUAL</div>
                <div class="user-info">
                    <span class="user-name" id="userName">-</span>
                    <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
                </div>
            </header>

            <div class="obra-selector">
                <label>Obra seleccionada</label>
                <select class="form-select" id="obraSelect" onchange="cambiarObra()">
                    <option value="">Cargando...</option>
                </select>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="enObra">En obra</button>
                <button class="tab" data-tab="historial">Historial</button>
                <button class="tab" data-tab="denegados">⚠️ Denegados <span id="badgeDenegados" style="display:none;background:var(--danger);color:white;padding:2px 6px;border-radius:10px;font-size:11px;margin-left:4px;">0</span></button>
            </div>

            <!-- EN OBRA -->
            <section class="section active" id="secEnObra">
                <div class="stats">
                    <div class="stat"><div class="stat-value success" id="statEnObra">0</div><div class="stat-label">En obra</div></div>
                    <div class="stat"><div class="stat-value" id="statSalieron">0</div><div class="stat-label">Ya salieron</div></div>
                    <div class="stat"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Fichajes hoy</div></div>
                    <div class="stat"><div class="stat-value warning" id="statTardes">0</div><div class="stat-label">Tarde</div></div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span class="card-title">TRABAJADORES HOY</span>
                        <button class="btn btn-secondary btn-sm" onclick="cargarEnObra()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                            Actualizar
                        </button>
                    </div>
                    <div id="listaEnObra"><div class="loading"><div class="spinner"></div></div></div>
                </div>
            </section>

            <!-- HISTORIAL -->
            <section class="section" id="secHistorial">
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">HISTORIAL DE FICHAJES</span>
                        <button class="btn btn-secondary btn-sm" onclick="exportarHistorial()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            Excel
                        </button>
                    </div>
                    <div class="filters">
                        <input type="date" id="histDesde" onchange="cargarHistorial()">
                        <span style="color:var(--text2);font-size:13px;">a</span>
                        <input type="date" id="histHasta" onchange="cargarHistorial()">
                    </div>
                    <div class="table-container" id="tablaHistorial"><div class="loading"><div class="spinner"></div></div></div>
                    <div class="pagination" id="paginacion"></div>
                </div>
            </section>

            <!-- DENEGADOS -->
            <section class="section" id="secDenegados">
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">⚠️ ACCESOS DENEGADOS</span>
                        <button class="btn btn-secondary btn-sm" onclick="marcarTodosVistos()">Marcar todos vistos</button>
                    </div>
                    <p style="color:var(--text2);margin-bottom:12px;font-size:13px;">Trabajadores que intentaron fichar pero fueron rechazados.</p>
                    <div class="table-container" id="tablaDenegados"><div class="loading"><div class="spinner"></div></div></div>
                </div>
            </section>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://istrnsicleopzbsrapsw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzdHJuc2ljbGVvcHpic3JhcHN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MTIxMTYsImV4cCI6MjA5MTM4ODExNn0.5UXV2LWPXmbfLI7rKpZSG9YBzZsesjckHnhQabA0mTY';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let encargadoData = null;
        let obrasAsignadas = [];
        let obraActual = null;
        let historialPage = 1;
        const ITEMS_PER_PAGE = 50;

        const $ = id => document.getElementById(id);
        const showScreen = id => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); };
        const formatTime = d => d ? new Date(d).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) : '-';
        const formatDate = d => d ? new Date(d).toLocaleDateString('es-ES') : '-';
        const today = () => new Date().toISOString().split('T')[0];
        const getInitials = n => n ? n.split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase() : '--';

        // Tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                $('sec' + tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1)).classList.add('active');
                if (tab.dataset.tab === 'historial') cargarHistorial();
                if (tab.dataset.tab === 'denegados') cargarDenegados();
            });
        });

        // Login
        $('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = $('loginEmail').value.trim().toLowerCase();
            const password = $('loginPassword').value;
            const btn = $('btnLogin');
            btn.disabled = true;
            btn.textContent = 'ENTRANDO...';

            try {
                const { data, error } = await db.from('encargados').select('*').eq('email', email).eq('password', password).single();
                if (error || !data) {
                    $('loginError').textContent = 'Credenciales incorrectas';
                    $('loginError').style.display = 'block';
                } else {
                    encargadoData = data;
                    if ($('rememberMe').checked) localStorage.setItem('encargado_session', JSON.stringify(data));
                    $('userName').textContent = data.nombre || data.email;
                    $('loginError').style.display = 'none';
                    showScreen('screenDashboard');
                    await cargarObras();
                }
            } catch (err) {
                $('loginError').textContent = 'Error de conexión';
                $('loginError').style.display = 'block';
            }
            btn.disabled = false;
            btn.textContent = 'INICIAR SESIÓN';
        });

        function logout() {
            localStorage.removeItem('encargado_session');
            encargadoData = null;
            showScreen('screenLogin');
        }

        async function cargarObras() {
            const { data: asignaciones } = await db.from('obras_encargados').select('obra_id, obras(id, nombre)').eq('encargado_id', encargadoData.id);
            obrasAsignadas = (asignaciones || []).map(a => a.obras).filter(Boolean);
            
            if (obrasAsignadas.length) {
                $('obraSelect').innerHTML = obrasAsignadas.map(o => `<option value="${o.id}">${o.nombre}</option>`).join('');
                obraActual = obrasAsignadas[0];
                cargarEnObra();
            } else {
                $('obraSelect').innerHTML = '<option value="">No tienes obras asignadas</option>';
            }
        }

        function cambiarObra() {
            const id = $('obraSelect').value;
            obraActual = obrasAsignadas.find(o => o.id === id);
            cargarEnObra();
        }

        async function cargarEnObra() {
            if (!obraActual) return;
            $('listaEnObra').innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            const hoy = today();
            const { data: fichajes } = await db.from('fichajes')
                .select('*, trabajadores(nombre, dni, empresas(nombre))')
                .eq('obra_id', obraActual.id)
                .gte('hora', hoy + 'T00:00:00')
                .lte('hora', hoy + 'T23:59:59')
                .order('hora', { ascending: false });

            const entradas = (fichajes || []).filter(f => f.tipo === 'entrada');
            const salidas = (fichajes || []).filter(f => f.tipo === 'salida');
            const salidaIds = new Set(salidas.map(s => s.trabajador_id));
            const enObra = entradas.filter(e => !salidaIds.has(e.trabajador_id));
            const tardes = entradas.filter(f => f.es_tarde);

            $('statEnObra').textContent = enObra.length;
            $('statSalieron').textContent = entradas.length - enObra.length;
            $('statTotal').textContent = entradas.length;
            $('statTardes').textContent = tardes.length;

            if (entradas.length) {
                let html = '<div class="worker-list">';
                for (const entrada of entradas) {
                    const salida = salidas.find(s => s.trabajador_id === entrada.trabajador_id);
                    const estaEnObra = !salida;
                    const t = entrada.trabajadores;
                    html += `
                        <div class="worker-item ${estaEnObra ? 'en-obra' : 'salio'}">
                            <span class="dot ${estaEnObra ? 'green' : 'gray'}"></span>
                            <div class="worker-avatar">${getInitials(t?.nombre)}</div>
                            <div class="worker-info">
                                <div class="worker-name">${t?.nombre || '-'}${entrada.es_tarde ? '<span class="late-tag">TARDE</span>' : ''}</div>
                                <div class="worker-meta">${t?.dni || '-'} · ${t?.empresas?.nombre || '-'}</div>
                            </div>
                            <div class="worker-time">
                                ${formatTime(entrada.hora)}${salida ? ' → ' + formatTime(salida.hora) : ''}
                            </div>
                        </div>
                    `;
                }
                $('listaEnObra').innerHTML = html + '</div>';
            } else {
                $('listaEnObra').innerHTML = '<div class="empty">No hay fichajes hoy</div>';
            }
        }

        async function cargarHistorial() {
            if (!obraActual) return;
            const desde = $('histDesde').value;
            const hasta = $('histHasta').value;

            let query = db.from('fichajes')
                .select('*, trabajadores(nombre, dni, empresas(nombre))', { count: 'exact' })
                .eq('obra_id', obraActual.id);
            if (desde) query = query.gte('hora', desde + 'T00:00:00');
            if (hasta) query = query.lte('hora', hasta + 'T23:59:59');
            query = query.order('hora', { ascending: false }).range((historialPage - 1) * ITEMS_PER_PAGE, historialPage * ITEMS_PER_PAGE - 1);

            const { data: fichajes, count } = await query;

            if (fichajes && fichajes.length) {
                let html = `<table><thead><tr><th>Trabajador</th><th>Fecha</th><th>Empresa</th><th>Entrada</th><th>Salida</th><th>Horas</th></tr></thead><tbody>`;
                for (const f of fichajes) {
                    if (f.tipo === 'entrada') {
                        const salida = fichajes.find(s => s.tipo === 'salida' && s.trabajador_id === f.trabajador_id && new Date(s.hora).toDateString() === new Date(f.hora).toDateString() && new Date(s.hora) > new Date(f.hora));
                        let horas = '-';
                        if (salida) { const diff = (new Date(salida.hora) - new Date(f.hora)) / (1000 * 60 * 60); horas = diff.toFixed(2) + 'h'; }
                        html += `<tr>
                            <td><strong>${f.trabajadores?.nombre || '-'}</strong><br><small style="color:var(--text2)">${f.trabajadores?.dni || ''}</small></td>
                            <td>${formatDate(f.hora)}</td>
                            <td>${f.trabajadores?.empresas?.nombre || '-'}</td>
                            <td>${formatTime(f.hora)} ${f.es_tarde ? '<span class="badge warning" style="font-size:10px;">Tarde</span>' : ''} ${f.es_manual ? '<span class="badge manual">M</span>' : ''}</td>
                            <td>${salida ? formatTime(salida.hora) : '<span class="badge danger">Sin salida</span>'}</td>
                            <td>${horas}</td>
                        </tr>`;
                    }
                }
                $('tablaHistorial').innerHTML = html + '</tbody></table>';
                const totalPages = Math.ceil(count / ITEMS_PER_PAGE);
                $('paginacion').innerHTML = `<button class="btn btn-sm btn-secondary" onclick="historialPage--;cargarHistorial()" ${historialPage <= 1 ? 'disabled' : ''}>← Ant</button><span>Pág ${historialPage}/${totalPages}</span><button class="btn btn-sm btn-secondary" onclick="historialPage++;cargarHistorial()" ${historialPage >= totalPages ? 'disabled' : ''}>Sig →</button>`;
            } else {
                $('tablaHistorial').innerHTML = '<div class="empty">No hay fichajes en este período</div>';
                $('paginacion').innerHTML = '';
            }
        }

        async function exportarHistorial() {
            if (!obraActual) return;
            const desde = $('histDesde').value;
            const hasta = $('histHasta').value;

            let query = db.from('fichajes').select('*, trabajadores(nombre, dni, empresas(nombre))').eq('obra_id', obraActual.id);
            if (desde) query = query.gte('hora', desde + 'T00:00:00');
            if (hasta) query = query.lte('hora', hasta + 'T23:59:59');
            const { data: fichajes } = await query.order('hora', { ascending: false });

            if (!fichajes?.length) { alert('No hay datos para exportar'); return; }

            const rows = fichajes.map(f => ({
                Trabajador: f.trabajadores?.nombre,
                DNI: f.trabajadores?.dni,
                Empresa: f.trabajadores?.empresas?.nombre,
                Fecha: formatDate(f.hora),
                Hora: formatTime(f.hora),
                Tipo: f.tipo,
                Tarde: f.es_tarde ? 'Sí' : 'No',
                Manual: f.es_manual ? 'Sí' : 'No'
            }));

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Historial');
            XLSX.writeFile(wb, `${obraActual.nombre}_historial_${today()}.xlsx`);
        }

        // === ACCESOS DENEGADOS ===
        async function cargarDenegados() {
            if (!obraActual) return;
            
            const { data: denegados, error } = await db.from('accesos_denegados')
                .select('*')
                .eq('obra_id', obraActual.id)
                .order('fecha', { ascending: false })
                .limit(50);
            
            if (error) {
                console.error('Error:', error);
                $('tablaDenegados').innerHTML = '<div class="empty">Error al cargar</div>';
                return;
            }
            
            if (denegados && denegados.length) {
                let html = `<table><thead><tr><th>Estado</th><th>DNI</th><th>Motivo</th><th>Fecha/Hora</th><th>Acciones</th></tr></thead><tbody>`;
                for (const d of denegados) {
                    html += `<tr style="${d.visto ? 'opacity:0.5;' : ''}">
                        <td>${d.visto ? '<span class="badge">Visto</span>' : '<span class="badge danger">⚠️ Nuevo</span>'}</td>
                        <td><strong>${d.dni}</strong></td>
                        <td style="font-size:12px;">${d.motivo}</td>
                        <td>${formatDate(d.fecha)} ${formatTime(d.fecha)}</td>
                        <td>${!d.visto ? `<button class="btn btn-sm btn-secondary" onclick="marcarVisto('${d.id}')">✓</button>` : ''}</td>
                    </tr>`;
                }
                $('tablaDenegados').innerHTML = html + '</tbody></table>';
            } else {
                $('tablaDenegados').innerHTML = '<div class="empty">No hay accesos denegados en esta obra</div>';
            }
            
            // Actualizar badge
            const { count } = await db.from('accesos_denegados').select('*', { count: 'exact', head: true }).eq('obra_id', obraActual.id).eq('visto', false);
            if (count > 0) {
                $('badgeDenegados').textContent = count;
                $('badgeDenegados').style.display = 'inline';
            } else {
                $('badgeDenegados').style.display = 'none';
            }
        }

        async function marcarVisto(id) {
            await db.from('accesos_denegados').update({ visto: true }).eq('id', id);
            cargarDenegados();
        }

        async function marcarTodosVistos() {
            if (!obraActual) return;
            await db.from('accesos_denegados').update({ visto: true }).eq('obra_id', obraActual.id).eq('visto', false);
            cargarDenegados();
        }

        async function init() {
            $('histDesde').value = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0];
            $('histHasta').value = today();

            const saved = localStorage.getItem('encargado_session');
            if (saved) {
                try {
                    encargadoData = JSON.parse(saved);
                    $('userName').textContent = encargadoData.nombre || encargadoData.email;
                    showScreen('screenDashboard');
                    await cargarObras();
                } catch (e) {
                    localStorage.removeItem('encargado_session');
                }
            }
        }

        // Auto-refresh cada 30 segundos
        setInterval(() => {
            if (encargadoData && obraActual) {
                if ($('secEnObra').classList.contains('active')) cargarEnObra();
                // Siempre actualizar badge de denegados
                cargarDenegados();
            }
        }, 30000);

        init();
    </script>
</body>
</html>
